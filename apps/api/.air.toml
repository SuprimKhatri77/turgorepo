# Air config for hot reload
# Install: go install github.com/air-verse/air@v1.67.4
root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/main"
  # Rename into place so a rebuild triggered during startup can't leave air running
  # a half-written binary, which fails with "Text file busy" and never retries.
  cmd = "go build -o ./tmp/main.new ./cmd/server && mv ./tmp/main.new ./tmp/main"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = false
  trigger_ext = [".go", ".tpl", ".tmpl", ".html", ".sql"]

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true
  skip_extra = false

[screen]
  clear_on_rebuild = true
  keep_scroll = true

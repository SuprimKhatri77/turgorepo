# Runs the production images locally, to check them before deploying. On AWS these
# run as ECS tasks instead (see docs/deploy-aws.md).
#
#   cp .env.production.example .env.production
#   docker compose --env-file .env.production -f docker-compose.prod.yml --profile local-deps up --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml run --rm api /app/migrate up
#
# Drop --profile local-deps and point DATABASE_URL and REDIS_URL at external
# services (Neon, RDS, ElastiCache) to test against those.
name: turgorepo-prod

services:
  api:
    build:
      context: ./apps/api
    ports:
      - "${API_PORT:-5000}:5000"
    env_file:
      - .env.production

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:?Set INTERNAL_API_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?Set COOKIE_DOMAIN}
    depends_on:
      - api

  db:
    profiles: [local-deps]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: turgorepo
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    profiles: [local-deps]
    image: redis:7-alpine

volumes:
  pgdata:

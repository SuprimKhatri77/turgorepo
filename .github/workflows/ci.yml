name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Check generated OpenAPI client
        run: bun run generate:check

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - name: Check generated sqlc code
        run: bun run db:sqlc:check

      - name: Typecheck
        run: bun run check-types

      - name: Lint JS/TS
        run: bun run lint

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/api
          args: ./...

      - name: Test Go
        working-directory: apps/api
        run: go test ./...

      - name: Check Go vulnerabilities
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:5000
          INTERNAL_API_URL: http://localhost:5000
          COOKIE_DOMAIN: localhost

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Check generated OpenAPI client
        run: bun run generate:check

      - name: Setup sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.31.1"

      - name: Check generated sqlc code
        run: bun run db:sqlc:check

      - name: Typecheck
        run: bun run check-types

      - name: Lint JS/TS
        run: bun run lint

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: apps/api
          args: ./...

      - name: Test Go
        working-directory: apps/api
        run: go test ./...

      - name: Check Go vulnerabilities
        working-directory: apps/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:5000
          INTERNAL_API_URL: http://localhost:5000
          COOKIE_DOMAIN: localhost

  migrations:
    name: Migrations up and down
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          # Throwaway database, so it needs no password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: turgorepo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/turgorepo?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Migrate up, down, and up again
        working-directory: apps/api
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate down 4
          go run ./cmd/migrate up

  images:
    name: Build production images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -t turgorepo-api apps/api

      - name: Build web image
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=https://api.example.com
          -t turgorepo-web .

  # template:start
  template-init:
    name: Template init
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run the init script
        run: bun run init --name acme-app --module github.com/acme/acme-app

      - name: Check that nothing was missed
        run: |
          if git grep -il turgorepo -- ':!LICENSE' ; then
            echo "Files above still mention the template name"
            exit 1
          fi
          git ls-files --others --exclude-standard | (! grep -i turgorepo)

      - name: Typecheck
        run: bun run check-types

      - name: Build and test the API
        working-directory: apps/api
        run: |
          go build ./...
          go test ./...
  # template:end
